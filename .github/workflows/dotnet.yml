
name: RaceDay Part 2 Build and Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "Part 2/RaceDay.API.slnx"

      - name: Build
        run: dotnet build "Part 2/RaceDay.API.slnx" --configuration Release --no-restore

      - name: Test
        run: dotnet test "Part 2/RaceDay.API.slnx" --configuration Release --no-build
